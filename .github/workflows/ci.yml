name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ══════════════════════════════════════════════════════════════════════════════
# PYRAMID LEVEL 0 — LINT
# Fast static checks on ubuntu. All run in parallel; unit tests wait for all.
# ══════════════════════════════════════════════════════════════════════════════

jobs:

  cargo-fmt:
    name: "L0 · cargo fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  version-sync:
    name: "L0 · version sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hook version must match across all three files
        run: |
          MAIN=$(grep -E 'EXPECTED_HOOK_VERSION: u32 = [0-9]+' src/main.rs \
                   | grep -oE '[0-9]+' | tail -1)
          SWIFT=$(grep -E 'expectedHookVersion = [0-9]+' \
                   ui/LocalForgeApp/ReposViewModel.swift \
                   | grep -oE '[0-9]+' | tail -1)
          HOOK=$(grep -E '^# LOCALFORGE_HOOK_VERSION=[0-9]+' hooks/pre-commit \
                  | grep -oE '[0-9]+' | tail -1)
          echo "main.rs:              EXPECTED_HOOK_VERSION   = $MAIN"
          echo "ReposViewModel.swift: expectedHookVersion     = $SWIFT"
          echo "hooks/pre-commit:     LOCALFORGE_HOOK_VERSION = $HOOK"
          if [ "$MAIN" != "$SWIFT" ] || [ "$MAIN" != "$HOOK" ]; then
            echo ""
            echo "ERROR: hook version mismatch. All three must be identical."
            echo "       See CLAUDE.md § Version Sync."
            exit 1
          fi
          echo "OK — hook version $MAIN is consistent."

  shellcheck:
    name: "L0 · shellcheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          shellcheck --severity=warning \
            scripts/build_release.sh \
            scripts/install_hook.sh \
            scripts/notarize.sh \
            scripts/package_dmg.sh \
            scripts/package_homebrew.sh \
            hooks/pre-commit

  python-lint:
    name: "L0 · ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v1
        with:
          args: "check coreml/ tests/ walkthrough/ --select E,F,W --ignore E501"

  corpus-check:
    name: "L0 · corpus integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate layer3_eval_corpus.py schema
        run: |
          pip install pytest --quiet
          pytest tests/check_corpus.py -v

# ══════════════════════════════════════════════════════════════════════════════
# PYRAMID LEVEL 1 — UNIT TESTS
# Rust tests cover: ast_validator (20 TP + 10 FP patterns), advisory_engine
# (Severity parsing, advisory_run_does_not_panic), mcp_server, ane_bridge.
# Runs on Apple Silicon — the only supported target.
# ══════════════════════════════════════════════════════════════════════════════

  unit:
    name: "L1 · cargo test + clippy"
    runs-on: macos-15
    needs: [cargo-fmt, version-sync, shellcheck, python-lint, corpus-check]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: clippy (warnings → errors)
        run: cargo clippy --target aarch64-apple-darwin -- -D warnings

      - name: cargo test
        run: cargo test --target aarch64-apple-darwin

# ══════════════════════════════════════════════════════════════════════════════
# PYRAMID LEVEL 2 — L1 BINARY INTEGRATION
# Builds the actual `localforge` binary and pipes known-bad and known-clean
# git diffs through `localforge --scan`.  This is the only test that exercises
# the CLI layer, binary startup, and stdin plumbing — none of which the Rust
# unit tests cover.
#
# True-positive set  → assert exit 1 (commit blocked)
# False-positive set → assert exit 0 (commit passes)
# Latency gate       → each scan < 500 ms
# ══════════════════════════════════════════════════════════════════════════════

  l1-integration:
    name: "L2 · L1 binary golden set"
    runs-on: macos-15
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build binary (debug)
        run: cargo build --target aarch64-apple-darwin

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run L1 + scan-pr + allow + dry-run integration tests
        run: |
          pip install pytest --quiet
          pytest tests/test_l1_integration.py tests/test_scan_pr_integration.py tests/test_allow_integration.py tests/test_dry_run_integration.py tests/test_status_integration.py tests/test_daemon_integration.py tests/test_validate_patterns_integration.py -v \
            --tb=short \
            --junit-xml=test-results/l1-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l1-integration-results
          path: test-results/

# ══════════════════════════════════════════════════════════════════════════════
# PYRAMID LEVEL 3 — LAYER 3 REGRESSION CHECK (informational, not required)
# Runs a small fixed subset of the Layer 3 eval corpus (tests/layer3_ci_check.py)
# against a live Qwen/MLX model and compares aggregate precision/recall/F1 to
# a checked-in baseline. mlx_lm's default sampler is deterministic (argmax),
# verified empirically, but this stays informational rather than required:
# a hosted runner's exact Apple Silicon generation can differ from the one
# that captured the baseline, which can shift floating-point results at the
# margins even under greedy decoding. continue-on-error keeps that residual
# risk from blocking unrelated PRs while still surfacing regressions clearly.
# ══════════════════════════════════════════════════════════════════════════════

  layer3-check:
    name: "L3 · advisory regression check"
    runs-on: macos-15
    needs: unit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Qwen 1.5B model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--mlx-community--Qwen2.5-Coder-1.5B-Instruct-4bit
          key: qwen2.5-coder-1.5b-4bit-v1

      - name: Install mlx-lm
        run: pip install --quiet mlx-lm

      - name: Download model (no-op if cache hit)
        run: python3 -c "from mlx_lm import load; load('mlx-community/Qwen2.5-Coder-1.5B-Instruct-4bit')"

      - name: Run Layer 3 regression check
        run: |
          SNAP=$(find ~/.cache/huggingface/hub/models--mlx-community--Qwen2.5-Coder-1.5B-Instruct-4bit/snapshots -mindepth 1 -maxdepth 1 -type d | head -1)
          python3 tests/layer3_ci_check.py --model-dir "$SNAP"

# ══════════════════════════════════════════════════════════════════════════════
# REQUIRED CHECK — gates branch protection
# ══════════════════════════════════════════════════════════════════════════════

  ci-pass:
    name: "CI passed"
    runs-on: ubuntu-latest
    needs: [unit, l1-integration]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.unit.result }}"          != "success" ]] || \
             [[ "${{ needs.l1-integration.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
