name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe the problem you're solving and what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently difficult or impossible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like LocalForge to do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Layer 1 — new detection pattern
        - Layer 2 — CoreML model
        - Layer 3 — Qwen advisory
        - MCP server
        - SwiftUI app
        - CLI / install experience
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR for this.
