name: Bug report
description: Something isn't working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can.

  - type: input
    id: version
    attributes:
      label: LocalForge version
      description: Run `localforge --version` and paste the output.
      placeholder: "localforge 2.1.3"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Run `sw_vers` and paste the ProductVersion line.
      placeholder: "15.0"
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer is affected?
      options:
        - Layer 1 — regex scanner (ast_validator)
        - Layer 2 — CoreML classifier
        - Layer 3 — Qwen advisory
        - MCP server
        - SwiftUI app
        - CLI / install / hook
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Stage a file with `git add ...`
        2. Run `git commit`
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste output from `~/.localforge/hook.log` or the terminal.
        This is automatically formatted as code.
      render: shell
